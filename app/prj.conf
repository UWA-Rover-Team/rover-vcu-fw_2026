CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_LOG=y
CONFIG_CAN=y

CONFIG_NET_DHCPV4=y

# --- MCUmgr / DFU ---
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# UDP transport
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
CONFIG_MCUMGR_TRANSPORT_UDP_PORT=1337

# flash/image handling support
CONFIG_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y

# needed by mcumgr's base64/CBOR encoding
CONFIG_BASE64=y
CONFIG_ZCBOR=y

CONFIG_GATEWAY_UDP_PORT=5555
